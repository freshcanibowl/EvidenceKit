name: Security Review (local code checks)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run existing and security regression tests
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Enforce loopback-only and no public share in demo entrypoint
        run: python scripts/check_demo_boundary.py
